<svg xmlns="http://www.w3.org/2000/svg" width="900" height="350" viewBox="0 0 900 350" role="img" aria-labelledby="concentration-title concentration-desc">
  <title id="concentration-title">Konsentrasi komentar menurut video</title>
  <desc id="concentration-desc">5 video teratas menyumbang 71,72 persen observasi; 43 video lain 28,28 persen.</desc>
  <rect width="900" height="350" fill="#FFFFFF"/>
  <text x="36" y="42" fill="#23313F" font-size="23" font-weight="600" font-family="Arial, sans-serif">Konsentrasi komentar menurut video</text>
  <text x="255" y="81" fill="#526170" font-size="13" font-family="Arial, sans-serif">Persentase dari seluruh observasi</text>
  <line x1="255.0" y1="96" x2="255.0" y2="256" stroke="#DCE3E9" stroke-width="1"/>
  <text x="255.0" y="282" text-anchor="middle" fill="#526170" font-size="13" font-family="Arial, sans-serif">0%</text>
  <line x1="363.0" y1="96" x2="363.0" y2="256" stroke="#DCE3E9" stroke-width="1"/>
  <text x="363.0" y="282" text-anchor="middle" fill="#526170" font-size="13" font-family="Arial, sans-serif">20%</text>
  <line x1="471.0" y1="96" x2="471.0" y2="256" stroke="#DCE3E9" stroke-width="1"/>
  <text x="471.0" y="282" text-anchor="middle" fill="#526170" font-size="13" font-family="Arial, sans-serif">40%</text>
  <line x1="579.0" y1="96" x2="579.0" y2="256" stroke="#DCE3E9" stroke-width="1"/>
  <text x="579.0" y="282" text-anchor="middle" fill="#526170" font-size="13" font-family="Arial, sans-serif">60%</text>
  <line x1="687.0" y1="96" x2="687.0" y2="256" stroke="#DCE3E9" stroke-width="1"/>
  <text x="687.0" y="282" text-anchor="middle" fill="#526170" font-size="13" font-family="Arial, sans-serif">80%</text>
  <line x1="795.0" y1="96" x2="795.0" y2="256" stroke="#DCE3E9" stroke-width="1"/>
  <text x="795.0" y="282" text-anchor="middle" fill="#526170" font-size="13" font-family="Arial, sans-serif">100%</text>
  <text x="36" y="143" fill="#23313F" font-size="16" font-family="Arial, sans-serif">5 video teratas</text>
  <rect x="255" y="120" width="387.3" height="32" fill="#2364AA"/>
  <text x="652.3" y="143" fill="#23313F" font-size="15" font-weight="600" font-family="Arial, sans-serif">71,72%</text>
  <text x="36" y="225" fill="#23313F" font-size="16" font-family="Arial, sans-serif">43 video lainnya</text>
  <rect x="255" y="202" width="152.7" height="32" fill="#8291A0"/>
  <text x="417.7" y="225" fill="#23313F" font-size="15" font-weight="600" font-family="Arial, sans-serif">28,28%</text>
  <text x="36" y="322" fill="#526170" font-size="14" font-family="Arial, sans-serif">Video diurutkan berdasarkan jumlah observasi setelah deduplikasi.</text>
</svg>
