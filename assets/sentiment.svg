<svg xmlns="http://www.w3.org/2000/svg" width="900" height="350" viewBox="0 0 900 350" role="img" aria-labelledby="sentiment-title sentiment-desc">
  <title id="sentiment-title">Proporsi label positif berbasis aturan</title>
  <desc id="sentiment-desc">Aturan memberi label positif pada 26,96 persen komentar yang menyebut Sheila dan 14,50 persen komentar lain. Belum divalidasi oleh manusia.</desc>
  <rect width="900" height="350" fill="#FFFFFF"/>
  <text x="36" y="42" fill="#23313F" font-size="23" font-weight="600" font-family="Arial, sans-serif">Proporsi label positif berbasis aturan</text>
  <text x="255" y="81" fill="#526170" font-size="13" font-family="Arial, sans-serif">Persentase dalam masing-masing kelompok</text>
  <line x1="255.0" y1="96" x2="255.0" y2="256" stroke="#DCE3E9" stroke-width="1"/>
  <text x="255.0" y="282" text-anchor="middle" fill="#526170" font-size="13" font-family="Arial, sans-serif">0%</text>
  <line x1="332.1" y1="96" x2="332.1" y2="256" stroke="#DCE3E9" stroke-width="1"/>
  <text x="332.1" y="282" text-anchor="middle" fill="#526170" font-size="13" font-family="Arial, sans-serif">5%</text>
  <line x1="409.3" y1="96" x2="409.3" y2="256" stroke="#DCE3E9" stroke-width="1"/>
  <text x="409.3" y="282" text-anchor="middle" fill="#526170" font-size="13" font-family="Arial, sans-serif">10%</text>
  <line x1="486.4" y1="96" x2="486.4" y2="256" stroke="#DCE3E9" stroke-width="1"/>
  <text x="486.4" y="282" text-anchor="middle" fill="#526170" font-size="13" font-family="Arial, sans-serif">15%</text>
  <line x1="563.6" y1="96" x2="563.6" y2="256" stroke="#DCE3E9" stroke-width="1"/>
  <text x="563.6" y="282" text-anchor="middle" fill="#526170" font-size="13" font-family="Arial, sans-serif">20%</text>
  <line x1="640.7" y1="96" x2="640.7" y2="256" stroke="#DCE3E9" stroke-width="1"/>
  <text x="640.7" y="282" text-anchor="middle" fill="#526170" font-size="13" font-family="Arial, sans-serif">25%</text>
  <line x1="717.9" y1="96" x2="717.9" y2="256" stroke="#DCE3E9" stroke-width="1"/>
  <text x="717.9" y="282" text-anchor="middle" fill="#526170" font-size="13" font-family="Arial, sans-serif">30%</text>
  <line x1="795.0" y1="96" x2="795.0" y2="256" stroke="#DCE3E9" stroke-width="1"/>
  <text x="795.0" y="282" text-anchor="middle" fill="#526170" font-size="13" font-family="Arial, sans-serif">35%</text>
  <text x="36" y="143" fill="#23313F" font-size="16" font-family="Arial, sans-serif">Menyebut Sheila</text>
  <rect x="255" y="120" width="416.0" height="32" fill="#2364AA"/>
  <text x="681.0" y="143" fill="#23313F" font-size="15" font-weight="600" font-family="Arial, sans-serif">26,96%</text>
  <text x="36" y="225" fill="#23313F" font-size="16" font-family="Arial, sans-serif">Komentar lain</text>
  <rect x="255" y="202" width="223.7" height="32" fill="#8291A0"/>
  <text x="488.7" y="225" fill="#23313F" font-size="15" font-weight="600" font-family="Arial, sans-serif">14,50%</text>
  <text x="36" y="322" fill="#526170" font-size="14" font-family="Arial, sans-serif">Label dari aturan kata; belum diukur akurasi terhadap label manusia.</text>
</svg>
